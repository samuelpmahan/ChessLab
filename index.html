<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHESSLAB / debugger</title>
<style>
:root{color-scheme:dark;--bg:#07100d;--panel:#0d1a15;--panel-hi:#11241c;--fg:#d8e9df;--muted:#8ba99a;--accent:#a4f3bc;--edge:#315440;--black:#c8a57a;--white:#d9e4df;--danger:#ff9e82;--square-a:#1c392a;--square-b:#0b2017;--size:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:var(--size)/1.35 ui-monospace,SFMono-Regular,Consolas,monospace}body[data-theme=amber]{--bg:#161108;--panel:#21190d;--panel-hi:#2a2112;--fg:#f1e3ca;--muted:#bca989;--accent:#ffd080;--edge:#68522d;--black:#c8a57a;--white:#f3e4c2;--danger:#ffac79;--square-a:#4c3a1f;--square-b:#211a0e}body[data-theme=ice]{--bg:#080f1a;--panel:#101d2d;--panel-hi:#172b40;--fg:#dcecff;--muted:#8fa9c4;--accent:#86caff;--edge:#35516e;--black:#c4a98b;--white:#d9edff;--danger:#ff9f9f;--square-a:#1b3b54;--square-b:#0d1d2b}main{height:100dvh;min-height:420px;display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(132px,22vh) auto;gap:8px;padding:10px;overflow:hidden}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--edge);padding-bottom:7px}h1{margin:0;font-size:20px;letter-spacing:.08em;color:var(--accent)}header a{margin-left:auto;color:var(--muted);font-size:11px}button,select,input{font:inherit;color:inherit}button,select{background:var(--panel);border:1px solid var(--edge);padding:5px 8px;border-radius:3px}button{cursor:pointer}button:hover,button:focus-visible,select:focus-visible{border-color:var(--accent);outline:1px solid color-mix(in srgb,var(--accent),transparent 75%)}button:disabled{opacity:.35;cursor:default}#settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}#settings label{display:flex;align-items:center;gap:5px}input[type=range]{width:82px;accent-color:var(--accent)}#size-label{color:var(--accent);min-width:2ch}#layout{min-height:0;display:grid;grid-template-columns:minmax(180px,1fr) minmax(360px,2.5fr) minmax(180px,1fr);gap:8px}section{min-width:0;min-height:0;border:1px solid var(--edge);background:var(--panel)}.side-panel{overflow:auto;padding:0 8px 8px}.side-title,.panel-title{position:sticky;top:0;z-index:1;padding:7px 4px;color:var(--accent);border-bottom:1px solid var(--edge);background:var(--panel);font-size:11px;letter-spacing:.07em}.panel-title{display:flex;justify-content:space-between;align-items:center;padding-left:10px;padding-right:10px}.readout-block{border-bottom:1px solid color-mix(in srgb,var(--edge),transparent 42%);padding:7px 2px}.readout-block h3{margin:0 0 5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.readout-list{margin:0;padding:0 0 0 18px;font-size:11px}.readout-list li{padding:2px 0;overflow-wrap:anywhere}.readout-list li.empty{list-style:none;margin-left:-18px;color:var(--muted);font-style:italic}.material-list{list-style:none;padding-left:0}.material-list li{display:inline-block;border:1px solid color-mix(in srgb,var(--edge),transparent 25%);margin:0 3px 3px 0;padding:2px 4px}.candidate-button{display:block;width:100%;text-align:left;padding:3px 4px;background:transparent;border-color:transparent;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.candidate-button:hover,.candidate-button:focus-visible{background:var(--panel-hi);border-color:var(--accent)}.raw-block{margin:7px 0;color:var(--muted);font-size:10px}.selection-readout{display:block;color:var(--fg);font-size:10px;margin-top:6px}.selection-readout strong{color:var(--accent);font-weight:normal}.provenance .raw-block{border-top:1px solid color-mix(in srgb,var(--edge),transparent 42%);padding-top:4px}.raw-block summary{cursor:pointer;color:var(--accent)}.raw-block pre{max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;color:var(--fg)}#world{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden}#viewport{min-height:0;overflow:auto;padding:10px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--panel-hi),transparent 25%),transparent 70%)}#board-grid{display:grid;grid-template-columns:1.5em repeat(8,minmax(0,1fr)) 1.5em;grid-template-rows:1.5em repeat(8,minmax(0,1fr)) 1.5em;width:min(100%,calc(100dvh - 275px));aspect-ratio:1/1;min-width:240px;max-width:760px;max-height:100%;user-select:none}.board-label{display:grid;place-items:center;color:var(--muted);font-size:10px}.board-cell{position:relative;min-width:0;min-height:0;border:0;border-radius:0;padding:0;display:grid;place-items:center;background:var(--square-a);color:var(--white);font-size:clamp(20px,4vw,42px);line-height:1}.board-cell.dark{background:var(--square-b)}.board-cell:hover,.board-cell:focus-visible{z-index:2;outline:2px solid var(--accent);outline-offset:-2px}.board-cell .piece-code{position:absolute;left:3px;top:2px;font-size:8px;color:color-mix(in srgb,var(--fg),transparent 32%);font-weight:bold}.board-cell .piece-glyph{filter:drop-shadow(0 1px 1px #000);font-family:"Noto Sans Symbols 2","DejaVu Sans",sans-serif}.board-cell .cell-coordinate{position:absolute;right:3px;bottom:2px;font-size:8px;color:color-mix(in srgb,var(--fg),transparent 55%);opacity:.65}.board-cell.relation-source{box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 20px color-mix(in srgb,var(--accent),transparent 58%)}.board-cell.relation-target{box-shadow:inset 0 0 0 3px var(--danger),inset 0 0 20px color-mix(in srgb,var(--danger),transparent 55%)}.board-cell.changed-source{outline:2px dashed var(--muted);outline-offset:-5px}.board-cell.changed-target{box-shadow:inset 0 0 0 3px var(--accent)}#board-caption{padding:6px 12px;border-top:1px solid var(--edge);font-size:11px;overflow-wrap:anywhere}#board-caption strong{color:var(--accent);font-weight:normal}#status{font-size:11px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#console{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0;overflow:hidden}#output{min-height:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:7px 12px;margin:0;font:inherit;font-size:11px}form{display:flex;align-items:center;gap:7px;padding:6px 8px;border-top:1px solid var(--edge)}#command{min-width:0;flex:1;border:0;outline:0;background:transparent}nav{display:flex;gap:5px;flex-wrap:wrap;padding:5px 8px;border-top:1px solid var(--edge)}nav button{font-size:11px}footer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}footer span{margin-left:auto}body[data-layout=board] #layout{grid-template-columns:minmax(0,1fr)}body[data-layout=board] .side-panel{display:none}body[data-layout=stack] #layout{grid-template-columns:1fr;grid-template-rows:minmax(280px,1fr) minmax(180px,1fr) minmax(180px,1fr);overflow:auto}body[data-layout=stack] #world{grid-row:1}body[data-layout=stack] .side-panel{overflow:visible}@media(max-width:1050px){main{grid-template-rows:auto auto minmax(0,1fr) minmax(122px,24vh) auto;padding:7px;gap:6px}#layout{grid-template-columns:minmax(145px,1fr) minmax(300px,2fr) minmax(145px,1fr);gap:6px}.side-panel{padding-left:6px;padding-right:6px}.board-cell{font-size:clamp(18px,3.6vw,34px)}}@media(max-width:760px){main{height:auto;min-height:100dvh;overflow:visible;grid-template-rows:auto auto auto minmax(150px,28vh) auto}#layout{grid-template-columns:1fr;grid-template-rows:minmax(360px,65dvh) auto auto;overflow:visible}#world{grid-row:1}.side-panel{overflow:visible}.board-cell{font-size:clamp(22px,8vw,40px)}#board-grid{width:min(100%,calc(100vw - 30px));min-width:0}footer span{display:none}header a{display:none}}

/* Viewport debugger: terminal is a drawer; semantic panes keep their own scroll. */
main{min-height:0;grid-template-rows:auto auto minmax(0,1fr) auto auto}
#console{display:none;height:180px}body[data-console=open] #console{display:grid}
#case-choice{max-width:340px;min-width:100px}#settings{min-width:0}
.readout-block{border:0;border-bottom:1px solid var(--edge)}.readout-block p{font-size:calc(var(--size) - 2px);margin:4px 0;overflow-wrap:anywhere}.muted{color:var(--muted)}
.candidate-button{white-space:normal;line-height:1.4;font-size:calc(var(--size) - 2px)}.readout-list{list-style:none;padding-left:0;font-size:calc(var(--size) - 2px)}.readout-list li.empty{margin:0}
#board-caption{max-height:180px;overflow:auto}.selection-readout{font-size:calc(var(--size) - 2px)}
#board-grid{min-width:0;max-width:none;flex-shrink:0}.piece-code{position:absolute;left:3px;top:2px;font:11px ui-monospace,monospace;color:var(--fg)}.board-cell{padding:0;min-width:0;min-height:0}.board-cell.selected-piece{outline:3px solid var(--accent);outline-offset:-3px}
@media(max-width:760px){main{height:100dvh;min-height:0;overflow:hidden;padding:5px;gap:5px;grid-template-rows:auto auto minmax(0,1fr) auto auto}#layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,3fr) minmax(0,2fr);overflow:hidden}#world{grid-row:1;grid-column:1/-1}.side-panel{overflow:auto;min-height:0}#black-panel{grid-row:2;grid-column:1}#white-panel{grid-row:2;grid-column:2}#board-caption{max-height:85px}#board-grid{min-width:0}#settings{gap:5px}#case-choice{max-width:230px}body[data-layout=board] #layout{grid-template-columns:1fr;grid-template-rows:1fr}body[data-layout=stack] #layout{grid-template-columns:1fr;grid-template-rows:minmax(250px,1fr) 200px 200px;overflow:auto}body[data-layout=stack] #black-panel{grid-row:2;grid-column:1}body[data-layout=stack] #white-panel{grid-row:3;grid-column:1}#console{height:150px}.board-cell .piece-glyph{font-size:clamp(16px,6vw,30px)}}

</style>
</head>
<body>
<main>
<header><h1>CHESSLAB_</h1><a id="revision" href="https://github.com/samuelpmahan/ChessLab">c3676fb</a></header>
<div id="settings" aria-label="Display settings"><label>Case <select id="case-choice" aria-label="Learning case"></select></label><label>Policy <select id="policy-choice" aria-label="Policy variant"><option value="clean">Clean</option><option value="exp">Experimental</option></select></label><label>Layout <select id="layout-choice"><option value="split">Three columns</option><option value="board">Board focus</option><option value="stack">Stacked</option></select></label><label>Palette <select id="theme-choice"><option value="green">Phosphor</option><option value="amber">Amber</option><option value="ice">Ice</option></select></label><label><input id="fit" type="checkbox" checked>Fit board</label><label>Text <input id="text-size" type="range" min="11" max="22" value="14"><output id="size-label">14</output></label><button id="defaults">Reset display</button></div>
<div id="layout">
<section id="black-panel" class="side-panel" aria-label="Black analysis"></section>
<section id="world" aria-label="Board"><div class="panel-title">02 / BOARD <span id="mode-label">REPLAY</span></div><div id="viewport"><div id="board-grid" role="grid" aria-label="Chess board"></div></div><div id="board-caption"><strong>CASE NOTE</strong> <a id="case-source" target="_blank" rel="noopener">source ↗</a> · <span id="analysis-title"></span><br><span id="analysis-note"></span><div id="selection-readout" class="selection-readout"></div><div id="provenance"></div></div><div id="status" aria-live="polite"></div></section>
<section id="white-panel" class="side-panel" aria-label="White analysis"></section>
</div>
<section id="console"><div class="panel-title">04 / TERMINAL <button data-command="clear">Clear</button></div><pre id="output" role="log" aria-live="polite"></pre><form id="form"><label for="command">&gt;</label><input id="command" aria-label="Terminal command" autocomplete="off" spellcheck="false" placeholder="why / run / inspect"><button>Run</button></form><nav><button data-command="why">Explain</button><button data-command="run">Objects</button><button data-command="inspect WQ">Queen</button><button data-command="place WK e5">Expose escape</button><button data-command="save">Save</button><button data-command="load">Load</button></nav></section>
<footer><button id="terminal-toggle" aria-expanded="false">Terminal / objects</button><button data-command="replay">Restart replay</button><button data-command="back">← Back</button><button data-command="next">Next →</button><button data-command="study">Study</button><span>← → replay · / command · w White / b Black</span></footer>
</main>
<input type="file" id="upload" accept=".json,application/json" hidden>
<script type="module" src="./site/browser.js?v=c3676fb15de8ce7ded90f50ef42e2b99558273a8658873b3a5146afa1e1a70dc"></script>
</body>
</html>
