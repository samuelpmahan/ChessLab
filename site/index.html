<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHESSLAB</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101613;color:#d5e9da;font:15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #35453b;padding-bottom:14px}h1{font-size:23px;margin:0;color:#b6ffc4}a{color:#a6cfb0}#layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}#board{font-size:14px;line-height:1.5;white-space:pre;overflow:auto}#status{margin:12px 0;color:#b6ffc4}#output{height:420px;overflow:auto;background:#0a100d;border:1px solid #35453b;padding:14px;font-size:13px}form{display:flex;gap:10px;align-items:center;border:1px solid #52685b;padding:10px;margin-top:10px}input{font:inherit;background:transparent;color:inherit;border:0;outline:0;min-width:0;flex:1}button{font:inherit;color:#d5e9da;background:#243c2d;border:1px solid #55705d;padding:8px 12px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}small{color:#98ac9d}.note{color:#98ac9d;margin-top:20px;font-size:12px}@media(max-width:700px){main{padding:15px}#layout{grid-template-columns:1fr}#output{height:320px}#board{font-size:13px;line-height:1.4}}
</style>
<main><header><h1>CHESSLAB<span style="color:#6c9777">_</span></h1><a id="revision" href="https://github.com/samuelpmahan/ChessLab">ea584a2</a></header>
<div id="layout"><section><pre id="board" aria-label="Chess board"></pre><div id="status"></div><small>White: Kw Qw · Black: Kb Qb</small><p class="note">A composed King + Queen study position.<br>Try <b>place WK e5</b> to expose an escape.<br>Position editing, not a game move.</p></section>
<section><pre id="output" role="log" aria-live="polite"></pre><form id="form"><label for="command">&gt;</label><input id="command" aria-label="Terminal command" autocomplete="off" spellcheck="false" placeholder="why"><button>Run</button></form><nav><button data-command="replay">Famous finish</button><button data-command="back">Back</button><button data-command="next">Next</button><button data-command="study">Study</button><button data-command="why">Why mate?</button><button data-command="inspect WQ">Queen</button><button data-command="place WK e5">Expose escape</button><button data-command="reset">Reset</button><button data-command="save">Save</button><button data-command="load">Load</button></nav></section></div>
<input type="file" id="upload" accept=".json,application/json" hidden>
<p class="note">Commands: why · inspect [WK/WQ/BK] · place ID SQUARE · turn white/black · history · receipt · board · reset · save · load · clear</p></main><script type="module" src="./browser.js"></script></html>
