<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHESSLAB</title>
<style>
:root{color-scheme:dark;--bg:#0c1412;--panel:#101c18;--fg:#d7e8df;--accent:#a4f3bc;--edge:#354d40;--size:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:var(--size)/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}body[data-theme=amber]{--bg:#17130c;--panel:#211b11;--fg:#eee0c6;--accent:#ffd080;--edge:#625033}body[data-theme=ice]{--bg:#0d1420;--panel:#142032;--fg:#d6e6fa;--accent:#86caff;--edge:#354c68}main{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:12px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--edge);padding-bottom:8px}h1{margin:0;font-size:20px;color:var(--accent)}a{color:var(--accent)}button,select,input{font:inherit;color:inherit}button,select{background:var(--panel);border:1px solid var(--edge);padding:6px 10px;border-radius:3px}button{cursor:pointer}button:hover,button:focus-visible,select:focus-visible{border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}#settings{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}label{display:flex;align-items:center;gap:6px}input[type=range]{width:90px;accent-color:var(--accent)}#layout{min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,2fr);gap:10px}section{min-width:0;min-height:0;border:1px solid var(--edge);background:var(--panel)}.panel-title{padding:7px 12px;color:var(--accent);border-bottom:1px solid var(--edge);font-size:12px;display:flex;justify-content:space-between}#world{display:grid;grid-template-rows:auto minmax(0,1fr) auto}#viewport{min-height:0;overflow:auto;padding:10px;display:grid;place-items:center}pre{margin:0}#board{white-space:pre;line-height:1.25;width:max-content;font-family:inherit}#status{font-size:12px;padding:7px 12px;border-top:1px solid var(--edge)}#console{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto}#output{min-height:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;font:inherit}form{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--edge)}#command{min-width:0;flex:1;border:0;outline:0;background:transparent}nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--edge)}footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}footer span{margin-left:auto;color:var(--accent)}body[data-layout=board] #layout{grid-template-columns:1fr}body[data-layout=board] #console{display:none}body[data-layout=stack] #layout{grid-template-columns:1fr;grid-template-rows:minmax(0,3fr) minmax(130px,2fr)}@media(max-width:760px){main{padding:6px;gap:6px}#layout{grid-template-columns:1fr;grid-template-rows:minmax(0,3fr) minmax(110px,2fr)}body[data-layout=board] #layout{grid-template-rows:1fr}#settings{gap:6px}#settings label{font-size:11px}button,select{padding:5px 7px}footer span{display:none}}
</style>
<main><header><h1>CHESSLAB_</h1><a id="revision" href="https://github.com/samuelpmahan/ChessLab">fa516eb</a></header>
<div id="settings" aria-label="Display settings"><label>Layout <select id="layout-choice"><option value="split">Split</option><option value="board">Board focus</option><option value="stack">Stacked</option></select></label><label>Palette <select id="theme-choice"><option value="green">Phosphor</option><option value="amber">Amber</option><option value="ice">Ice</option></select></label><label><input id="fit" type="checkbox" checked>Fit board</label><label>Text <input id="text-size" type="range" min="11" max="22" value="14"><output id="size-label">14</output></label><button id="defaults">Reset display</button></div>
<div id="layout"><section id="world"><div class="panel-title">01 / WORLD <span id="mode-label">REPLAY</span></div><div id="viewport"><pre id="board" aria-label="Chess board"></pre></div><div id="status" aria-live="polite"></div></section>
<section id="console"><div class="panel-title">02 / INSPECTOR <button data-command="clear">Clear</button></div><pre id="output" role="log" aria-live="polite"></pre><form id="form"><label for="command">&gt;</label><input id="command" aria-label="Terminal command" autocomplete="off" spellcheck="false" placeholder="why / run / inspect"><button>Run</button></form><nav><button data-command="why">Explain</button><button data-command="run">Objects</button><button data-command="inspect WQ">Queen</button><button data-command="place WK e5">Expose escape</button><button data-command="save">Save</button><button data-command="load">Load</button></nav></section></div>
<footer><button data-command="replay">Restart replay</button><button data-command="back">← Back</button><button data-command="next">Next →</button><button data-command="study">Study</button><span>← → replay · / command · w White / b Black</span></footer></main>
<input type="file" id="upload" accept=".json,application/json" hidden><script type="module" src="./browser.js"></script></html>
